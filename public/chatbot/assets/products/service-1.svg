<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <radialGradient id="r1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="350" fill="url(#g1)" rx="16" />
  <circle cx="300" cy="175" r="160" fill="url(#r1)" />
  
  <!-- Icon: Compass / Strategy -->
  <g transform="translate(250, 80) scale(1.6)" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="28" stroke="rgba(255,255,255,0.4)" stroke-dasharray="4 4"/>
    <circle cx="32" cy="32" r="24" stroke="#38bdf8" />
    <polygon points="32,16 38,28 32,48 26,36" fill="#38bdf8" stroke="#ffffff" />
    <circle cx="32" cy="32" r="3" fill="#ffffff" />
  </g>

  <!-- Labels -->
  <text x="300" y="240" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="0.5">
    Digital Strategy &amp; Advisory
  </text>
  <text x="300" y="275" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#bae6fd">
