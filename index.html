<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AICE Services — Engineering & AI Studio</title>

    <link rel="canonical" href="https://www.aiceservices.com/" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="preload" as="image" href="/img/hero.webp" fetchpriority="high" media="(min-width: 701px)" />
    <link rel="preload" as="image" href="/img/hero-m.webp" fetchpriority="high" media="(max-width: 700px)" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AICE Services" />
    <meta property="og:title" content="AICE Services — Engineering & AI Studio" />
    <meta property="og:description" content="Engineering consultancy, custom websites in hours, AI voice and chat assistants, and AI video editing." />
    <meta property="og:url" content="https://www.aiceservices.com/" />
    <meta property="og:image" content="https://www.aiceservices.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AICE Services — Engineering & AI Studio" />
    <meta name="twitter:description" content="Engineering consultancy, custom websites, AI assistants and video, delivered fast." />
    <meta name="twitter:image" content="https://www.aiceservices.com/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=Geist+Mono:wght@400&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=Geist+Mono:wght@400&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=Geist+Mono:wght@400&display=swap" /></noscript>

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ProfessionalService",
          "@id": "https://www.aiceservices.com/#org",
          "name": "AICE Services",
          "url": "https://www.aiceservices.com/",
          "logo": "https://www.aiceservices.com/logo.svg",
          "image": "https://www.aiceservices.com/og-image.png",
          "slogan": "Engineering & AI studio",
          "description": "Civil engineering consultancy for donor-funded water, sanitation and solid-waste projects, plus custom websites, AI voice and chat assistants, and AI video editing.",
          "email": "contact@aiceservices.com",
          "telephone": "+92-301-3666088",
          "areaServed": "PK",
          "address": { "@type": "PostalAddress", "addressLocality": "Lahore", "addressCountry": "PK" },
          "founder": { "@type": "Person", "name": "Muhammad Tulaib Hasan", "jobTitle": "Founder" },
          "openingHoursSpecification": [
            { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"], "opens": "09:00", "closes": "18:00" },
            { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "09:00", "closes": "14:00" }
          ],
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Services",
            "itemListElement": [
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Engineering Consultancy", "description": "Water supply, wastewater, treatment and integrated solid waste management design; design review; bid documents, preparation and evaluation; grievance redressal; contract management, planning and scheduling, variations, extension of time, claims, disputes and arbitration." } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom Websites", "description": "Fast, mobile-first custom websites designed and built in hours on a minimal budget." } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Voice & Chat Assistants", "description": "Custom text and voice assistants trained on your documents and built into your website." } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Video Editing", "description": "Reels, ads and explainers with captions, motion graphics and sound, including matching a reference edit." } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Android TV Customisation", "description": "Custom ad-free Android TV launchers and lightweight high-resolution games for kids." } }
            ]
          }
        },
        { "@type": "WebApplication", "name": "AICEMark", "url": "https://www.aiceservices.com/tools/aicemark", "applicationCategory": "BusinessApplication", "operatingSystem": "Web", "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }, "description": "Convert Markdown and LaTeX into native Word (.docx) documents.", "publisher": { "@id": "https://www.aiceservices.com/#org" } }
      ]
    }
    </script>
  </head>
  <body style="background:#0a0a0b">
    <!-- Instant first paint: hero photo + headline before JavaScript loads. The app takes over seamlessly and removes this. -->
    <script>window.__bootT = performance.now();</script>
    <div id="boot" aria-hidden="true">
      <picture>
        <source media="(max-width: 700px)" srcset="/img/hero-m.webp" />
        <img src="/img/hero.webp" alt="" fetchpriority="high" />
      </picture>
      <div class="op-vignette"></div>
      <div class="op-intro wrap">
        <p class="eyebrow mono"><span class="mask-line"><span>AICE Services</span></span></p>
        <p class="mega"><span class="mask-line"><span>Engineering</span></span><span class="mask-line"><span style="animation-delay:.09s">&amp; AI studio</span></span></p>
        <div class="op-intro-foot">
          <p class="hero-sub"><span class="mask-line"><span style="animation-delay:.25s">Consultancy, websites, AI assistants and video.</span></span><span class="mask-line"><span style="animation-delay:.34s">Precise, and fast.</span></span></p>
          <span class="scroll-cue mono">Scroll <i></i></span>
        </div>
      </div>
    </div>
    <div id="root"></div>

    <!-- Static copy of the contact form so Netlify Forms can detect it at deploy time (React renders the visible one). -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input type="email" name="email" />
      <select name="service"><option value="x">x</option></select>
      <textarea name="details"></textarea>
    </form>

    <noscript>
      <p>AICE Services — AI + Civil Engineering for Smarter Cities. Please enable JavaScript to use this site, or email contact@aiceservices.com.</p>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
